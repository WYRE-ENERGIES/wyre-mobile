<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F4F2F8" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#05010A" media="(prefers-color-scheme: dark)" />
  <title>Wyre · Offline</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <style>
    :root { color-scheme: light dark; --bg: #F4F2F8; --card: #FFFFFF; --text: #111827; --muted: #6B7280; --accent: #5C12A7; }
    @media (prefers-color-scheme: dark) { :root { --bg: #05010A; --card: #17171B; --text: #F9FAFB; --muted: #A1A1AA; --accent: #8B3FE0; } }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; align-items: center; justify-content: center;
      padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
    }
    main { max-width: 360px; width: 100%; text-align: center; background: var(--card); border-radius: 20px; padding: 32px 24px; }
    img { width: 72px; height: 72px; border-radius: 18px; }
    h1 { font-size: 20px; margin: 20px 0 8px; }
    p { color: var(--muted); font-size: 15px; line-height: 1.5; margin: 0 0 24px; }
    button { appearance: none; border: 0; border-radius: 12px; background: var(--accent); color: #fff; font-size: 16px; font-weight: 600; padding: 14px 20px; width: 100%; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="" />
    <h1>You&rsquo;re offline</h1>
    <p>Wyre needs an internet connection to load your latest energy data. Check your connection and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
  <script>window.addEventListener('online', function () { location.reload(); });</script>
</body>
</html>
